# CI: secrets scan + tests on every push and pull request.
#
# Hardening: read-only token, actions pinned to full commit SHAs (Dependabot bumps them), the gitleaks binary is
# checksum-verified, no secrets are used, and pull_request (never pull_request_target) so fork code never runs with
# write access.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks 8.30.1 (checksum-verified)
        run: |
          curl -sSLf -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks && rm gl.tgz
      - name: Scan every commit
        run: ./gitleaks git --log-opts="--all" --redact --no-banner --exit-code 1 .
      - name: Local secret guard (same rules as the pre-commit hook)
        run: bash scripts/git-hooks/secret_guard.sh --tree

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio
      - name: Run tests
        run: |
          mkdir -p data logs
          python -m pytest tests -q -p no:cacheprovider

  images:
    name: Docker images (build and boot)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the app image
        run: docker build --pull -t aurix-app:ci .
      - name: Boot the app and wait for /api/health
        run: |
          docker run -d --name app -p 127.0.0.1:7000:7000 aurix-app:ci
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:7000/api/health; then echo; exit 0; fi
            sleep 2
          done
          docker logs --tail 120 app; exit 1
      - name: Build the mission sandbox image
        run: docker build --pull -t aurix-sandbox:ci mission_sandbox
      - name: Sandbox tools import under the production restrictions
        run: |
          docker run --rm --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges --user 1000:1000 \
            aurix-sandbox:ci python -c "import numpy, scipy, pandas, pydicom, SimpleITK, skimage, trimesh, stl, pymeshlab, faster_whisper; print('sandbox tools import OK')"
      - name: Boot the sandbox (fail-closed token, read-only, no capabilities) and wait for /health
        run: |
          docker run -d --name sbx -p 127.0.0.1:8765:8765 -e SANDBOX_TOKEN="$(openssl rand -hex 16)" \
            --read-only --tmpfs /tmp --tmpfs /app/data/workspace:uid=1000,gid=1000 \
            --cap-drop ALL --security-opt no-new-privileges --user 1000:1000 aurix-sandbox:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/health; then echo; exit 0; fi
            sleep 2
          done
          docker logs --tail 80 sbx; exit 1
      - name: docker-compose.yml is valid (all profiles)
        run: |
          cp .env.example .env            # compose requires the env_file; CI uses the example values
          NEO4J_PASSWORD=ci-placeholder docker compose --profile extras config -q
      - name: Build ReClip (pinned commit; the build fails if the option-injection patch no longer applies)
        run: docker build -t aurix-reclip:ci reclip
      - name: Build God's Eye View (pinned commit)
        run: docker build -t aurix-godseye:ci gods_eye
