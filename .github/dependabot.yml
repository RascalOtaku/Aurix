# Weekly dependency and GitHub Actions updates (security updates arrive as soon as an advisory lands).
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /mission_sandbox
    schedule: {interval: weekly}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
