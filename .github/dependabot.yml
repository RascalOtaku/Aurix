# Dependency updates, tuned so they do not become an email a week (owner, 2026-10-14: "Dependabot keeps emailing me").
#   * monthly, not weekly, and at most 2 open PRs per ecosystem;
#   * minor and patch updates are GROUPED: one PR per ecosystem per month instead of one per package;
#   * the GitHub Actions group takes everything together, because github/codeql-action/init and /analyze must move in lockstep (PR #16 bumped only
#     analyze and its own CodeQL run failed);
#   * major versions are left alone here (python 3.12 -> 3.14, actions/checkout 4 -> 7 ...): those are deliberate upgrades, done by hand with the full test suite.
# Security updates for known-vulnerable dependencies are separate from this file and still arrive as soon as an advisory lands.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: {interval: monthly}
    open-pull-requests-limit: 2
    groups:
      python-minor-and-patch: {patterns: ["*"], update-types: [minor, patch]}
    ignore:
      - {dependency-name: "*", update-types: ["version-update:semver-major"]}
  - package-ecosystem: npm
    directory: /
    schedule: {interval: monthly}
    open-pull-requests-limit: 2
    groups:
      npm-minor-and-patch: {patterns: ["*"], update-types: [minor, patch]}
    ignore:
      - {dependency-name: "*", update-types: ["version-update:semver-major"]}
  - package-ecosystem: docker
    directory: /
    schedule: {interval: monthly}
    open-pull-requests-limit: 2
    groups:
      docker-minor-and-patch: {patterns: ["*"], update-types: [minor, patch]}
    ignore:
      - {dependency-name: "*", update-types: ["version-update:semver-major"]}
  - package-ecosystem: docker
    directory: /mission_sandbox
    schedule: {interval: monthly}
    open-pull-requests-limit: 2
    groups:
      sandbox-docker-minor-and-patch: {patterns: ["*"], update-types: [minor, patch]}
    ignore:
      - {dependency-name: "*", update-types: ["version-update:semver-major"]}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: monthly}
    open-pull-requests-limit: 2
    groups:
      github-actions: {patterns: ["*"]}
    ignore:
      - {dependency-name: "*", update-types: ["version-update:semver-major"]}
