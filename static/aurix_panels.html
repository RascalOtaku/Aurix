<!DOCTYPE html><html><head><style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;height:100vh;display:flex;flex-direction:column;font-family:monospace}
.bar{display:flex;align-items:center;border-bottom:1px solid #333;flex-shrink:0;background:#0a0a0f}
.back{padding:10px 16px;color:#00ff88;text-decoration:none;border-right:1px solid #333}
.tab{padding:10px 18px;cursor:pointer;color:#555;border:none;background:none;font-family:monospace;font-size:13px;border-bottom:2px solid transparent}
.tab.on{color:#00ff88;border-bottom-color:#00ff88}
.panel{display:none;flex:1}
.panel.on{display:flex}
iframe{width:100%;height:100%;border:none;flex:1}
</style></head><body>
<div class="bar">
  <a class="back" href="/">← AURIX</a>
  <button class="tab on" data-p="cortex">🧠 Cortex</button>
  <button class="tab" data-p="agents">🤖 Agents</button>
  <button class="tab" data-p="jf">🎬 Jellyfin</button>
</div>
<div id="cortex" class="panel on"><iframe src="http://10.0.0.106:8888"></iframe></div>
<div id="agents" class="panel"><iframe src="/agents-panel"></iframe></div>
<div id="jf" class="panel"><iframe src="http://10.0.0.106:8096/web/index.html"></iframe></div>
<script nonce="{{CSP_NONCE}}">
document.querySelectorAll('.tab').forEach(function(t){t.addEventListener('click',function(){
document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on')});
document.querySelectorAll('.panel').forEach(function(x){x.classList.remove('on')});
t.classList.add('on');document.getElementById(t.dataset.p).classList.add('on');
});});
</script>
</body></html>
