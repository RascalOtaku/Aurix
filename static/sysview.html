<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AURIX Systems</title>
<style>
  :root {
    --bg: #0b0e14; --panel: #131822; --panel2: #182030; --line: #263145; --text: #d7deea; --dim: #7d8aa3;
    --ok: #3ddc97; --warn: #f5b942; --bad: #ff5d6c; --idle: #56627a; --accent: #6cb6ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, Segoe UI, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; padding: 12px 18px;
           border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5; }
  h1 { margin: 0; font-size: 17px; letter-spacing: .12em; font-weight: 600; }
  h1 span { color: var(--accent); }
  .chip { padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); font-size: 12px; color: var(--dim); }
  .chip.ok { color: var(--ok); border-color: #1f6e50; } .chip.bad { color: var(--bad); border-color: #7a2a33; }
  .chip.warn { color: var(--warn); border-color: #7a5d1f; }
  .spacer { flex: 1; }
  #stop { background: #3a1116; color: #ffb3bb; border: 1px solid #7a2a33; border-radius: 8px; padding: 8px 18px;
          font-weight: 700; letter-spacing: .1em; cursor: pointer; }
  #stop:hover { background: var(--bad); color: #fff; }
  main { display: grid; grid-template-columns: minmax(300px, 1fr) minmax(300px, 420px); gap: 16px; padding: 16px 18px; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .card h2 { margin: 0 0 8px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); font-weight: 600; }
  #map { width: 100%; height: auto; max-height: 76vh; display: block; }
  .organ { cursor: pointer; }
  .organ circle.body { stroke-width: 2.5; transition: fill .4s, stroke .4s; }
  .organ text { fill: var(--text); font-size: 13px; font-weight: 600; text-anchor: middle; pointer-events: none; }
  .organ:focus-visible { outline: none; } .organ:focus-visible circle.body { stroke-width: 4; }
  .organ.sel circle.halo { opacity: .55; }
  circle.halo { fill: none; stroke-width: 6; opacity: 0; transition: opacity .2s; }
  .s-ok { stroke: var(--ok); fill: #10261f; } .s-warn { stroke: var(--warn); fill: #2b2110; }
  .s-bad { stroke: var(--bad); fill: #2d1216; } .s-idle { stroke: var(--idle); fill: #161c28; }
  .halo.s-ok { stroke: var(--ok); fill: none; } .halo.s-warn { stroke: var(--warn); fill: none; }
  .halo.s-bad { stroke: var(--bad); fill: none; } .halo.s-idle { stroke: var(--idle); fill: none; }
  @keyframes beat { 0%, 100% { transform: scale(1); } 12% { transform: scale(1.09); } 24% { transform: scale(1); } 36% { transform: scale(1.06); } }
  .organ.pulse circle.body { animation: beat 1.3s infinite; transform-box: fill-box; transform-origin: center; }
  .silhouette { fill: #101623; stroke: #223049; stroke-width: 2; }
  .bone { stroke: #1b2740; stroke-width: 2; fill: none; }
  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; }
  dt { color: var(--dim); } dd { margin: 0; word-break: break-word; }
  .row { padding: 7px 0; border-bottom: 1px solid var(--line); } .row:last-child { border-bottom: 0; }
  .row b { font-weight: 600; } .dim { color: var(--dim); } .small { font-size: 12px; }
  .tag { font-size: 11px; padding: 1px 7px; border-radius: 6px; background: var(--panel2); color: var(--dim); margin-left: 6px; }
  .tag.active { color: var(--ok); } .tag.proposed { color: var(--warn); } .tag.failed, .tag.stopped { color: var(--bad); }
  .bar { height: 5px; border-radius: 3px; background: var(--panel2); margin-top: 5px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  #ticker { font: 12px/1.5 ui-monospace, Consolas, monospace; max-height: 260px; overflow: auto; }
  #ticker div { padding: 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #ticker .ev { color: var(--accent); } #ticker .denied, #ticker .ev.owner_stop { color: var(--bad); }
  .stack { display: flex; flex-direction: column; gap: 16px; }
  #err { display: none; margin: 12px 18px 0; padding: 10px 14px; border-radius: 8px; background: #2d1216; border: 1px solid #7a2a33; color: #ffb3bb; }
  #toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--panel2); border: 1px solid var(--line);
           padding: 10px 16px; border-radius: 10px; display: none; max-width: 90vw; z-index: 9; }
</style>
</head>
<body>
<header>
  <h1>AURIX <span>·</span> SYSTEMS</h1>
  <span class="chip" id="clock">--</span>
  <span class="chip" id="audit">audit: --</span>
  <span class="chip" id="mode">gate: --</span>
  <span class="chip" id="active">no active mission</span>
  <span class="spacer"></span>
  <span class="chip" id="live">connecting...</span>
  <button id="stop" type="button" title="Halt everything: mission, approvals, standing missions, sandbox processes">STOP</button>
</header>
<div id="err"></div>
<main>
  <section class="card">
    <h2>Body map <span class="dim small" style="text-transform:none;letter-spacing:0">- click an organ</span></h2>
    <svg id="map" viewBox="0 0 520 640" role="img" aria-label="AURIX subsystem map"></svg>
  </section>
  <div class="stack">
    <section class="card"><h2 id="detail-title">Select an organ</h2><dl id="detail"><dt></dt><dd class="dim">Click any organ on the map.</dd></dl></section>
    <section class="card"><h2>Waiting on you</h2><div id="approvals"></div></section>
    <section class="card"><h2>Missions</h2><div id="missions"></div></section>
    <section class="card"><h2>Standing (scheduled)</h2><div id="standing"></div></section>
  </div>
  <section class="card" style="grid-column: 1 / -1"><h2>Live audit ticker</h2><div id="ticker"></div></section>
</main>
<div id="toast"></div>
<script nonce="{{CSP_NONCE}}">
"use strict";
// Everything below renders with textContent / setAttribute only: mission text and tool previews are
// model-influenced, so they must never reach innerHTML.
const SVGNS = "http://www.w3.org/2000/svg";
const POS = {                              // organ -> [x, y] on the silhouette
  brain: [260, 78], nervous: [260, 172], immune: [150, 250], circulatory: [260, 262], muscular: [372, 250],
  memory: [260, 372], endocrine: [260, 468], skeletal: [260, 566],
};
const PULSE = new Set(["circulatory"]);
let state = null, selected = null, timer = null;
const $ = (id) => document.getElementById(id);

function el(tag, attrs, text) {
  const n = document.createElement(tag);
  for (const k in (attrs || {})) n.setAttribute(k, attrs[k]);
  if (text !== undefined) n.textContent = text;
  return n;
}
function svg(tag, attrs, text) {
  const n = document.createElementNS(SVGNS, tag);
  for (const k in (attrs || {})) n.setAttribute(k, attrs[k]);
  if (text !== undefined) n.textContent = text;
  return n;
}
function toast(msg) { const t = $("toast"); t.textContent = msg; t.style.display = "block"; setTimeout(() => t.style.display = "none", 6000); }

function drawSilhouette(m) {
  const g = svg("g");
  g.appendChild(svg("circle", { cx: 260, cy: 78, r: 56, class: "silhouette" }));
  g.appendChild(svg("rect", { x: 118, y: 200, width: 284, height: 300, rx: 60, class: "silhouette" }));
  g.appendChild(svg("rect", { x: 60, y: 210, width: 70, height: 230, rx: 34, class: "silhouette" }));
  g.appendChild(svg("rect", { x: 390, y: 210, width: 70, height: 230, rx: 34, class: "silhouette" }));
  g.appendChild(svg("rect", { x: 170, y: 490, width: 70, height: 130, rx: 30, class: "silhouette" }));
  g.appendChild(svg("rect", { x: 280, y: 490, width: 70, height: 130, rx: 30, class: "silhouette" }));
  g.appendChild(svg("path", { d: "M260 134 L260 540", class: "bone" }));   // spine
  m.appendChild(g);
}

const SHORT = { brain: "Brain", nervous: "Nerves", immune: "Immune", circulatory: "Heart", muscular: "Muscles",
                memory: "Memory", endocrine: "Rhythm", skeletal: "Skeleton" };
const nodes = {};

// The map is built ONCE; later polls only update classes/tooltips, so clicks are never lost to a rebuild.
function buildMap() {
  const m = $("map"); m.textContent = "";
  drawSilhouette(m);
  for (const key of Object.keys(POS)) {
    const [x, y] = POS[key];
    const g = svg("g", { class: "organ" + (PULSE.has(key) ? " pulse" : ""), tabindex: "0", role: "button" });
    const tip = svg("title"); g.appendChild(tip);
    const halo = svg("circle", { cx: x, cy: y, r: 46, class: "halo" });
    const body = svg("circle", { cx: x, cy: y, r: 39, class: "body" });
    g.appendChild(halo); g.appendChild(body);
    g.appendChild(svg("text", { x: x, y: y + 4 }, SHORT[key]));
    const pick = () => { selected = key; render(); };
    g.addEventListener("click", pick);
    g.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } });
    m.appendChild(g);
    nodes[key] = { g, tip, halo, body };
  }
}

function drawMap() {
  if (!nodes.brain) buildMap();
  for (const key of Object.keys(nodes)) {
    const o = state.organs[key], n = nodes[key]; if (!o) continue;
    n.body.setAttribute("class", "body s-" + o.status);
    n.halo.setAttribute("class", "halo s-" + o.status);
    n.g.setAttribute("class", "organ" + (selected === key ? " sel" : "") + (PULSE.has(key) ? " pulse" : ""));
    n.g.setAttribute("aria-label", o.title + " " + o.status);
    n.tip.textContent = o.title + " - " + o.sub + " (" + o.status + ")";
  }
}

function drawDetail() {
  const dl = $("detail"); dl.textContent = "";
  const o = selected && state.organs[selected];
  if (!o) { $("detail-title").textContent = "Select an organ"; dl.appendChild(el("dt")); dl.appendChild(el("dd", { class: "dim" }, "Click any organ on the map.")); return; }
  $("detail-title").textContent = o.title + " (" + o.sub + ") - " + o.status.toUpperCase();
  for (const k of Object.keys(o.metrics)) { dl.appendChild(el("dt", {}, k)); dl.appendChild(el("dd", {}, String(o.metrics[k]))); }
}

function emptyNote(parent, text) { parent.appendChild(el("div", { class: "dim small" }, text)); }

function drawLists() {
  const ap = $("approvals"); ap.textContent = "";
  if (!state.approvals.length) emptyNote(ap, "Nothing waiting.");
  for (const a of state.approvals) {
    const r = el("div", { class: "row" });
    const b = el("b", {}, a.tool); r.appendChild(b); r.appendChild(el("span", { class: "tag" }, a.id + " · " + a.age_s + "s"));
    r.appendChild(el("div", { class: "small" }, a.preview));
    if (a.risk) r.appendChild(el("div", { class: "small dim" }, a.risk));
    ap.appendChild(r);
  }
  const ms = $("missions"); ms.textContent = "";
  if (!state.missions.length) emptyNote(ms, "No missions yet. Message AURIX: mission: <goal>");
  for (const m of state.missions) {
    const r = el("div", { class: "row" });
    r.appendChild(el("b", {}, m.id)); r.appendChild(el("span", { class: "tag " + m.status }, m.status));
    if (m.sandboxed) r.appendChild(el("span", { class: "tag" }, "sandboxed"));
    r.appendChild(el("div", { class: "small" }, m.objective));
    if (m.status === "active") {
      r.appendChild(el("div", { class: "small dim" }, "step " + (m.step + 1) + "/" + m.steps + ": " + m.current + " · " + m.tool_calls + " tool calls"));
      const bar = el("div", { class: "bar" }), fill = el("i");
      fill.style.width = Math.min(100, Math.round(100 * m.step / Math.max(1, m.steps))) + "%"; bar.appendChild(fill); r.appendChild(bar);
    }
    ms.appendChild(r);
  }
  const sd = $("standing"); sd.textContent = "";
  if (!state.standing.length) emptyNote(sd, "None. Try: standing: <goal> every day at 03:00");
  for (const s of state.standing) {
    const r = el("div", { class: "row" });
    r.appendChild(el("b", {}, s.id)); r.appendChild(el("span", { class: "tag " + s.status }, s.status));
    r.appendChild(el("div", { class: "small" }, s.title + " - " + s.schedule));
    r.appendChild(el("div", { class: "small dim" }, s.runs + " runs" + (s.failing ? " · " + s.failing + " failing in a row" : "")));
    sd.appendChild(r);
  }
  const tk = $("ticker"); tk.textContent = "";
  for (const e of state.events) {
    const d = el("div");
    d.appendChild(el("span", { class: "dim" }, "#" + e.seq + " " + e.ts + "  "));
    d.appendChild(el("span", { class: "ev " + e.event }, e.event));
    d.appendChild(el("span", { class: "dim" }, "  " + e.subject + "  "));
    d.appendChild(document.createTextNode(e.detail));
    tk.appendChild(d);
  }
}

function drawHeader() {
  $("clock").textContent = state.local_time;
  const a = $("audit"); a.textContent = state.audit.ok ? "audit chain OK · " + state.audit.records : "AUDIT TAMPERING";
  a.className = "chip " + (state.audit.ok ? "ok" : "bad");
  const im = state.organs.immune.metrics;
  const mode = $("mode"); mode.textContent = "gate: " + im["gate mode"] + (state.stop ? " · STOP ENGAGED" : "");
  mode.className = "chip " + (state.stop ? "bad" : "");
  $("active").textContent = state.active ? "active: " + state.active : "no active mission";
  $("active").className = "chip " + (state.active ? "ok" : "");
}

function render() { drawHeader(); drawMap(); drawDetail(); drawLists(); }

async function poll() {
  try {
    const r = await fetch("/api/systems", { credentials: "same-origin", cache: "no-store" });
    if (r.status === 401 || r.status === 403) throw new Error("Not authorised - log in to AURIX as an admin first.");
    if (!r.ok) throw new Error("HTTP " + r.status);
    state = await r.json();
    $("err").style.display = "none";
    const l = $("live"); l.textContent = "live"; l.className = "chip ok";
    render();
  } catch (e) {
    $("err").textContent = String(e.message || e); $("err").style.display = "block";
    const l = $("live"); l.textContent = "offline"; l.className = "chip bad";
  }
}

$("stop").addEventListener("click", async () => {
  if (!confirm("STOP everything?\n\nHalts the active mission, denies all pending approvals, pauses standing missions and kills sandbox processes.")) return;
  try {
    const r = await fetch("/api/systems/stop", { method: "POST", credentials: "same-origin", headers: { "X-AURIX-Confirm": "STOP" } });
    const j = await r.json();
    toast(r.ok ? String(j.message).replace(/<[^>]+>/g, "") : "STOP failed: " + (j.detail || r.status));
  } catch (e) { toast("STOP failed: " + e); }
  poll();
});

function schedule() { clearInterval(timer); timer = setInterval(() => { if (!document.hidden) poll(); }, 3000); }
document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
poll(); schedule();
</script>
</body>
</html>
