# LiteLLM in front of Ollama (Activation Handoff §5/§10 task 7): one OpenAI-compatible endpoint that routes to the right box.
#   aurix-local            the GPU box (a Windows PC) - qwen2.5:7b, over Tailscale
#   aurix-local-cpu        the CPU box's own Ollama (CPU) - qwen2.5:3b - the real fallback when the GPU box is asleep.
#                          Needs the CPU box's firewall to allow this network (see poc/README in FOUNDATION_AUDIT_1 / the run notes).
#   aurix-local-alt        the GPU box's small model - used only to prove the fallback MECHANISM independent of the firewall
#   aurix-fallback-test    a primary that is DELIBERATELY unreachable: the router must give up quickly and fall back
model_list:
  - model_name: aurix-local
    litellm_params:
      model: ollama/qwen2.5:7b
      api_base: http://100.64.0.10:11434
  - model_name: aurix-local-cpu
    litellm_params:
      model: ollama/qwen2.5:3b
      api_base: http://host.docker.internal:11434
      timeout: 40                                  # fail fast if the firewall blocks it, never hang for minutes
  - model_name: aurix-local-alt
    litellm_params:
      model: ollama/qwen2.5:3b
      api_base: http://100.64.0.10:11434
  - model_name: aurix-fallback-test
    litellm_params:
      model: ollama/qwen2.5:7b
      api_base: http://10.255.255.1:11434        # a black hole: connect times out, so the router must fall back
      timeout: 6

router_settings:
  num_retries: 0
  timeout: 120
  fallbacks:
    - aurix-fallback-test: [aurix-local-alt]
    - aurix-local: [aurix-local-cpu]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  drop_params: true
  telemetry: false
